<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1913" />
      <stop offset="70%" stop-color="#0a0a09" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3BD" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#C6A76A" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>

    <!-- Subtle Inner Bezel Shadow -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C6A76A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7A6028" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Luxury Watch Case Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.8" />

  <!-- Inner Watch Bezel Circle -->
  <circle cx="32" cy="32" r="23" fill="#090909" stroke="url(#bezelGrad)" stroke-width="1.2" stroke-dasharray="1 3.5" stroke-linecap="round" />

  <!-- Inner Solid Dial Line -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" />

  <!-- Cardinal Hour Markers (12, 3, 6, 9) -->
  <rect x="31.25" y="14" width="1.5" height="4.5" rx="0.75" fill="url(#goldGrad)" />
  <rect x="45.5" y="31.25" width="4.5" height="1.5" rx="0.75" fill="url(#goldGrad)" />
  <rect x="31.25" y="45.5" width="1.5" height="4.5" rx="0.75" fill="url(#goldGrad)" />
  <rect x="14" y="31.25" width="4.5" height="1.5" rx="0.75" fill="url(#goldGrad)" />

  <!-- Subtle 10:10 Luxury Watch Hands -->
  <!-- Hour Hand pointing at 10 (approx -60 deg from 12) -->
  <line x1="32" y1="32" x2="23" y2="23" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
  <!-- Minute Hand pointing at 2 (approx +60 deg from 12) -->
  <line x1="32" y1="32" x2="43" y2="21" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Center Pinion Jewel / Pivot Cap -->
  <circle cx="32" cy="32" r="2.8" fill="url(#goldGrad)" />
  <circle cx="32" cy="32" r="1.1" fill="#050505" />

  <!-- Monogram 'O' subtle insignia at 6 o'clock position -->
  <circle cx="32" cy="40" r="1.8" fill="none" stroke="url(#goldGrad)" stroke-width="0.9" opacity="0.85" />
</svg>
